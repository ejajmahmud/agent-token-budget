[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-token-budget"
version = "0.1.0"
description = "Sliding-window token budget manager and degradation coordinator for multi-turn agent loops"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-token-budget = "agent_token_budget.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_token_budget*"]
